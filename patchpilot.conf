# PatchPilot Global Configuration File
# Location: /etc/patchpilot/patchpilot.conf or ./config/patchpilot.conf

# Operation Mode: 'audit' (read-only scan) or 'apply' (install updates)
DEFAULT_MODE="audit"

# Patch Scope: 'security' (CVE fixes only) or 'all' (all available updates)
PATCH_SCOPE="security"

# Automatic Reboot Policy:
# true  - Reboot immediately if required after patching
# false - Do not reboot; report reboot requirement as pending
AUTO_REBOOT="false"

# Maintenance Window (used by systemd timers / scheduler)
MAINTENANCE_WINDOW_DAY="Sun"
MAINTENANCE_WINDOW_TIME="03:00"

# Pre-flight Safety Checks
MIN_FREE_DISK_MB=2048
CHECK_LOAD_THRESHOLD=4.0

# Logging and Reporting
LOG_DIR="/var/log/patchpilot"
AUDIT_LOG_FILE="/var/log/patchpilot/last_audit.json"
HISTORY_LOG_FILE="/var/log/patchpilot/patch_history.log"

# Notification settings (optional)
ENABLE_NOTIFICATIONS="false"
ADMIN_EMAIL="sysadmin@example.com"
