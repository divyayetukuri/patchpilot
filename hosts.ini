# =============================================================================
# PatchPilot — Ansible Inventory
# inventory/hosts.ini
# =============================================================================

# ── Web Servers ───────────────────────────────────────────────────────────────
[webservers]
web01.example.com ansible_user=ubuntu  ansible_python_interpreter=/usr/bin/python3
web02.example.com ansible_user=ubuntu  ansible_python_interpreter=/usr/bin/python3

# ── Database Servers ──────────────────────────────────────────────────────────
[dbservers]
db01.example.com  ansible_user=ec2-user ansible_python_interpreter=/usr/bin/python3
db02.example.com  ansible_user=ec2-user ansible_python_interpreter=/usr/bin/python3

# ── App Servers ───────────────────────────────────────────────────────────────
[appservers]
app01.example.com ansible_user=ubuntu  ansible_python_interpreter=/usr/bin/python3
app02.example.com ansible_user=centos  ansible_python_interpreter=/usr/bin/python3

# ── Group Variables ───────────────────────────────────────────────────────────
[webservers:vars]
security_only=false
auto_reboot=true
critical_services=["sshd","nginx","cron"]

[dbservers:vars]
security_only=true
auto_reboot=false
critical_services=["sshd","postgresql","mysql","cron"]

[appservers:vars]
security_only=false
auto_reboot=true
critical_services=["sshd","myapp","cron"]

# ── All Linux Servers ─────────────────────────────────────────────────────────
[linux:children]
webservers
dbservers
appservers

[linux:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
report_dir=/var/lib/patchpilot/reports
log_dir=/var/log/patchpilot
