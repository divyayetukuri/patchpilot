# =============================================================================
# PatchPilot — ansible.cfg
# =============================================================================
[defaults]
inventory          = inventory/hosts.ini
remote_user        = ubuntu
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = yaml
roles_path         = roles
log_path           = /var/log/patchpilot/ansible.log
forks              = 10
timeout            = 30

[privilege_escalation]
become       = True
become_method = sudo
become_user  = root

[ssh_connection]
pipelining    = True
ssh_args      = -o ControlMaster=auto -o ControlPersist=60s
